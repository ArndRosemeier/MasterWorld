<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%234a7a3a%22/%3E%3C/svg%3E" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MasterWorld</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; color: #d8d2c4; font: 13px/1.4 Georgia, serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background: #0b0d10; transition: opacity 0.6s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .name { font: 400 34px/1 Georgia, serif; letter-spacing: 0.24em; text-indent: 0.24em; color: #efe6d2; text-transform: uppercase; }
      #loading .step { margin-top: 14px; min-height: 1.4em; color: #8a8070; letter-spacing: 0.06em; }
      #hud { position: fixed; left: 12px; top: 10px; pointer-events: none; white-space: pre; font: 12px/1.4 ui-monospace, monospace; text-shadow: 0 1px 2px #000; }
      /* The game's windows, talk, notes and the corner are in warded brass: src/app/windows.css. */
      /* The debug menu (src/app/debugMenu.ts, Ctrl+Shift+F12). */
      #debug { position: fixed; right: 16px; top: 16px; z-index: 15; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 80px); display: none; flex-direction: column; background: #0e1218f0; border: 1px solid #2c3846; border-radius: 10px; box-shadow: 0 10px 34px #0008; color: #d8dee6; font: 12px/1.35 system-ui, sans-serif; }
      #debug.open { display: flex; }
      #debug .dbg-head { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 12px; border-bottom: 1px solid #2c3846; }
      #debug .dbg-head span { color: #8fa3b5; font-size: 11px; }
      #debug .dbg-body { overflow-y: auto; padding: 4px 12px 8px; }
      #debug .dbg-sec h4 { margin: 8px 0 5px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #d8b56a; }
      #debug .dbg-sec button { margin: 0 5px 5px 0; padding: 4px 9px; border: 1px solid #3a4756; border-radius: 5px; background: #222c37; color: #e8ecf0; font-size: 12px; cursor: pointer; }
      #debug .dbg-sec button:hover { background: #2d3a48; border-color: #d8b56a; }
      #debug .dbg-log { min-height: 48px; max-height: 140px; overflow-y: auto; margin: 0 12px; padding: 6px 8px; background: #0a0d11; border-radius: 6px; font: 11px/1.4 ui-monospace, monospace; color: #a8d8a0; white-space: pre-wrap; word-break: break-all; }
      #debug .dbg-log .bad { color: #ff8a80; }
      #debug .dbg-cmd { margin: 8px 12px 12px; padding: 7px 9px; border: 1px solid #3a4756; border-radius: 6px; background: #0a0d11; color: #e8ecf0; font: 12px ui-monospace, monospace; outline: none; }
      #debug .dbg-cmd:focus { border-color: #d8b56a; }
    </style>
  </head>
  <body>
    <div id="loading"><div class="name">MasterWorld</div><div class="step">Loading</div></div>
    <noscript><p style="position:fixed;inset:0;z-index:30;margin:0;padding:40vh 16px 0;text-align:center">MasterWorld needs JavaScript.</p></noscript>
    <div id="hud"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
