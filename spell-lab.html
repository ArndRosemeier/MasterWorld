<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MasterWorld spell lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; color: #d8d2c4; font: 13px/1.4 Georgia, serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #bar { position: fixed; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100vw - 20px); }
      #bar button { padding: 4px 9px; border: 1px solid #3a4756; border-radius: 5px; background: #222c37cc; color: #e8ecf0; cursor: pointer; font: 12px system-ui, sans-serif; }
      #bar button.on { border-color: #d8b56a; }
      #name { position: fixed; left: 12px; bottom: 10px; font-size: 18px; text-shadow: 0 1px 3px #000; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="bar"></div>
    <div id="name"></div>
    <script type="module" src="/src/lab/spellLab.ts"></script>
  </body>
</html>
