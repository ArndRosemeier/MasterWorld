name: Pages

# The game, playable at https://arndrosemeier.github.io/MasterWorld/ after every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read access to the private ArndRosemeier/PrivateAssets (the library animals); without it the game draws Actors' animals.
      PRIVATE_ASSETS_TOKEN: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The whole history: the version counts the commits on main (tools/release).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The townsfolk's asset pack (Actors), cached by version.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/actors
          key: actors-packs-${{ hashFiles('package-lock.json') }}
      # The library animals (licensed for Arnd's games: shipped inside the built game, never committed here).
      - uses: actions/checkout@v4
        if: env.PRIVATE_ASSETS_TOKEN != ''
        with:
          repository: ArndRosemeier/PrivateAssets
          token: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
          path: vendor/private-assets
          sparse-checkout: wildmesh3d
      - run: npm run packs
      - run: npm run build
        env:
          VITE_BASE: /MasterWorld/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
