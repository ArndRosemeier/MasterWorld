name: CI

on:
  push:
    branches: [main]
  pull_request:

# Three jobs side by side; CI takes as long as the longest. Every step has a time budget (tools/guards/budget.mjs:
# warn seconds, fail seconds), so a slow step shows as a warning on the run's page long before it fails (docs/CHECKS.md).
jobs:
  test:
    name: Tests and guards
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The pin guard compares with the commit before HEAD on a push to main.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Submodule pins only move forward
        run: node tools/guards/pins.mjs
      - run: npm ci
      - name: Tests and guards
        run: node tools/guards/budget.mjs 50 60 -- npm test

  sims:
    name: Dungeon variety and the evening loop
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dungeon variety
        run: node tools/guards/budget.mjs 30 300 -- npm run variety
      - name: The evening loop
        run: node tools/guards/budget.mjs 60 300 -- npm run loop
      - name: A landform every minute of walking (gate L)
        run: node tools/guards/budget.mjs 30 300 -- npm run walk:landforms

  build:
    name: Build and WebGL 2 texture units
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # The runner's own Chrome: no Playwright browser download (about 25 s).
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: node tools/guards/budget.mjs 30 300 -- npm run build
      - name: Texture units on WebGL 2 (every material at most 16)
        run: node tools/guards/budget.mjs 60 300 -- npm run check:units

  # The one status that says CI passed (the name the merge rule waits for).
  check:
    needs: [test, sims, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        run: test "${{ needs.test.result }}" = success && test "${{ needs.sims.result }}" = success && test "${{ needs.build.result }}" = success
